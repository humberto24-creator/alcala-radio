<script>
// Ocultar barra del navegador automáticamente al cargar la página
window.addEventListener('load', () => {
    setTimeout(() => {
        window.scrollTo(0, 1);
    }, 0);
});

if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').catch(err => console.log('SW error:', err));
    });
}

const STREAM_URL = "https://stream.alcalafiesta.com/radio.mp3";
const ICECAST_JSON = "https://stream.alcalafiesta.com/status-json.xsl";
const DEFAULT_LOGO = "https://i.imgur.com/quYgKa7.png";
const PHONE = "573206137061";

let audio = new Audio();
audio.crossOrigin = "anonymous";
audio.preload = "auto";
audio.volume = 0.90;

let userWantsPlay = false;
let isReconnecting = false;
let currentTrack = "";
let currentArtist = "ALCALÁ FIESTA 90.3 FM";
let currentSongName = "EN VIVO";
let currentCoverUrl = DEFAULT_LOGO;

let audioCtx = null;
let analyser = null;
let source = null;
let vizInit = false;

const playBtn = document.getElementById("play");
const icon = document.getElementById("icon");
const songEl = document.getElementById("song");
const artistEl = document.getElementById("artist");
const songWrap = document.getElementById("songWrap");
const mainLogoEl = document.getElementById("mainLogo");
const volEl = document.getElementById("vol");
const modal = document.getElementById("modalChat");

function setIcon(state){
    playBtn.classList.remove("loading");
    if(state === "loading"){
        playBtn.classList.add("loading");
        icon.className = "fas fa-circle-notch";
    }else if(state === "pause"){
        icon.className = "fas fa-pause";
    }else{
        icon.className = "fas fa-play";
    }
}

function updateMediaSession(){
    if('mediaSession' in navigator){
        navigator.mediaSession.metadata = new MediaMetadata({
            title: currentSongName,
            artist: currentArtist,
            album: 'Alcalá Fiesta 90.3 FM',
            artwork: [{ src: currentCoverUrl, sizes: '512x512', type: 'image/png' }]
        });

        navigator.mediaSession.setActionHandler('play', () => { 
            userWantsPlay = true; 
            startStream(); 
        });
        navigator.mediaSession.setActionHandler('pause', () => { 
            stopStream(); 
        });
        navigator.mediaSession.setActionHandler('stop', () => { 
            stopStream(); 
        });
    }
}

function initViz(){
    if(vizInit) return;
    try{
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        analyser = audioCtx.createAnalyser();
        analyser.fftSize = 128;
        analyser.smoothingTimeConstant = 0.75;
        source = audioCtx.createMediaElementSource(audio);
        source.connect(analyser);
        analyser.connect(audioCtx.destination);
        vizInit = true;
        renderViz();
    }catch(e){ console.log("Viz:", e); }
}

function renderViz(){
    const canvas = document.getElementById("visualizer");
    const ctx = canvas.getContext("2d");

    const resize = () => {
        canvas.width = canvas.parentElement.clientWidth;
        canvas.height = canvas.parentElement.clientHeight;
    };
    resize();
    window.addEventListener("resize", resize);

    const len = analyser.frequencyBinCount;
    const data = new Uint8Array(len);

    function draw(){
        requestAnimationFrame(draw);
        if(!userWantsPlay || audio.paused){
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            return;
        }
        analyser.getByteFrequencyData(data);

        const w = canvas.width;
        const h = canvas.height;
        ctx.clearRect(0, 0, w, h);

        const bars = 45; 
        const gap = 2.5;
        const barW = (w - (gap * (bars - 1))) / bars;

        for(let i = 0; i < bars; i++){
            const index = Math.floor((i / bars) * (len * 0.85));
            const val = data[index] / 255;
            const bh = Math.max(4, val * h * 0.95);
            const x = i * (barW + gap);
            const y = h - bh;

            const grad = ctx.createLinearGradient(0, y, 0, h);
            grad.addColorStop(0, "#00f0ff");
            grad.addColorStop(0.5, "#0072ff");
            grad.addColorStop(1, "rgba(0, 114, 255, 0.15)");

            ctx.fillStyle = grad;
            ctx.shadowBlur = 6;
            ctx.shadowColor = "rgba(0, 240, 255, 0.4)";
            ctx.fillRect(x, y, barW, bh);
        }
        ctx.shadowBlur = 0;
    }
    draw();
}

async function startStream(){
    if(isReconnecting) return;
    isReconnecting = true;
    setIcon("loading");

    if(!vizInit) initViz();
    if(audioCtx && audioCtx.state === "suspended"){
        try{ await audioCtx.resume(); }catch(e){}
    }

    audio.pause();
    audio.src = STREAM_URL + "?live=" + Date.now();
    audio.load();
    
    try{
        await audio.play();
        setIcon("pause");
        updateMediaSession();
    }catch(e){
        if(userWantsPlay){
            setTimeout(startStream, 1000);
        }else{
            setIcon("play");
        }
    }finally{
        isReconnecting = false;
    }
}

function stopStream(){
    userWantsPlay = false;
    audio.pause();
    audio.removeAttribute("src");
    audio.load();
    setIcon("play");
}

function togglePlay(){
    if(userWantsPlay){
        stopStream();
    }else{
        userWantsPlay = true;
        startStream();
    }
}

playBtn.addEventListener("click", togglePlay);
volEl.addEventListener("input", e => audio.volume = Number(e.target.value));

audio.addEventListener("waiting", () => {
    if(userWantsPlay) setIcon("loading");
});

audio.addEventListener("playing", () => {
    if(userWantsPlay) setIcon("pause");
});

audio.addEventListener("error", () => {
    if(userWantsPlay && !isReconnecting){
        setTimeout(startStream, 1000);
    }
});

window.addEventListener("online", () => {
    if(userWantsPlay) startStream();
});

const forceReconnect = () => {
    if(userWantsPlay && (audio.paused || audio.readyState < 2)){
        startStream();
    }
};

document.addEventListener("visibilitychange", () => {
    if(!document.hidden) forceReconnect();
});

window.addEventListener("pageshow", forceReconnect);
window.addEventListener("focus", forceReconnect);

setInterval(() => {
    if(userWantsPlay && audio.paused && !isReconnecting){
        startStream();
    }
}, 1500);

function setMainCover(url){
    currentCoverUrl = (url && url !== DEFAULT_LOGO) ? url : DEFAULT_LOGO;
    mainLogoEl.src = currentCoverUrl;
    mainLogoEl.onerror = () => {
        currentCoverUrl = DEFAULT_LOGO;
        mainLogoEl.src = DEFAULT_LOGO;
    };
    updateMediaSession();
}

function updateWA(track){
    const msg = encodeURIComponent(`Hola Alcalá Fiesta, estoy escuchando: "${track}"`);
    const isMobile = /Android|iPhone|iPad/i.test(navigator.userAgent);
    document.getElementById("waLink").href = isMobile
        ? `https://api.whatsapp.com/send?phone=${PHONE}&text=${msg}`
        : `https://web.whatsapp.com/send?phone=${PHONE}&text=${msg}`;
}

function applyScroll(element, wrapper){
    element.classList.remove("marquee-active");
    element.textContent = element.dataset.text;

    if(element.scrollWidth > wrapper.clientWidth){
        element.innerHTML = `${element.dataset.text} &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp; ${element.dataset.text}`;
        element.classList.add("marquee-active");
    }
}

async function fetchiTunesCover(artist, song){
    try{
        const q = encodeURIComponent(`${artist} ${song}`.trim());
        const res = await fetch(`https://itunes.apple.com/search?term=${q}&media=music&entity=song&limit=1`);
        const data = await res.json();
        if(data.results && data.results.length){
            const art = data.results[0].artworkUrl100.replace("100x100bb", "500x500bb");
            setMainCover(art);
        }else{
            setMainCover(DEFAULT_LOGO);
        }
    }catch(e){
        setMainCover(DEFAULT_LOGO);
    }
}

async function updateMeta(){
    try{
        const res = await fetch(ICECAST_JSON + "?t=" + Date.now(), { cache: "no-store" });
        if(!res.ok) return;
        const data = await res.json();
        const src = data?.icestats?.source;
        if(!src) return;

        const s = Array.isArray(src) ? (src.find(i => i.mount === "/radio.mp3") || src[0]) : src;
        if(!s || !s.title) return;

        const raw = String(s.title).trim();
        if(!raw || raw === currentTrack) return;
        currentTrack = raw;

        let a = "", song = raw;
        if(raw.includes(" - ")){
            const p = raw.split(" - ");
            a = p.shift().trim();
            song = p.join(" - ").trim();
        }

        currentSongName = song || "EN VIVO";
        currentArtist = a || "ALCALÁ FIESTA 90.3 FM";

        songEl.dataset.text = currentSongName;
        artistEl.textContent = currentArtist;

        applyScroll(songEl, songWrap);

        updateWA(currentTrack);
        fetchiTunesCover(a, song);
        updateMediaSession();
    }catch(e){}
}

document.getElementById("chatBtn").addEventListener("click", e => {
    e.preventDefault();
    modal.style.display = "flex";
});

document.getElementById("closeModal").addEventListener("click", () => modal.style.display = "none");
modal.addEventListener("click", e => { if(e.target === modal) modal.style.display = "none"; });

window.addEventListener("load", () => {
    updateMeta();
    setInterval(updateMeta, 8000);
});
</script>
