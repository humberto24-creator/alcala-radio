<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#080c14">
<title>Instalar App | Alcalá Fiesta 90.3 FM</title>

<!-- PWA Manifest -->
<link rel="manifest" href="manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Alcalá Fiesta">

<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Dancing+Script:wght@700&display=swap" rel="stylesheet">

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
}

html, body {
    width: 100%;
    height: 100%;
    height: 100dvh;
    overflow: hidden;
    background: radial-gradient(circle at 50% 30%, #111a28 0%, #080c14 60%, #030508 100%);
    font-family: 'Inter', system-ui, -apple-system, sans-serif;
    color: #1e293b;
    display: flex;
    justify-content: center;
    align-items: center;
}

.install-card {
    width: min(90vw, 340px);
    background: rgba(255, 255, 255, 0.98);
    backdrop-filter: blur(12px);
    border-radius: 24px;
    border: 1px solid rgba(0, 240, 255, 0.35);
    box-shadow: 0 20px 50px rgba(0, 0, 0, 0.65), 0 0 25px rgba(0, 240, 255, 0.2);
    padding: 22px 18px;
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    gap: 14px;
}

.brand-header {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
}

.radio-badge {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    background: rgba(0, 114, 255, 0.1);
    color: #0072ff;
    border-radius: 999px;
    padding: 3px 10px;
    font-size: 8.5px;
    font-weight: 800;
    letter-spacing: 0.12em;
    text-transform: uppercase;
}

.welcome-title {
    font-size: 13px;
    font-weight: 900;
    letter-spacing: 0.05em;
    color: #0f172a;
    line-height: 1.25;
    text-transform: uppercase;
}

.logo-wrapper {
    width: 125px;
    height: 125px;
    border-radius: 24px;
    background: #ffffff;
    border: 1px solid #cbd5e1;
    box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
    overflow: hidden;
    padding: 4px;
}

.logo-wrapper img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    border-radius: 18px;
    display: block;
}

.info-text {
    font-size: 12.5px;
    font-weight: 500;
    color: #334155;
    line-height: 1.4;
    padding: 0 4px;
}

.install-btn {
    width: 100%;
    background: linear-gradient(135deg, #0041a8 0%, #0066ff 100%);
    color: #ffffff;
    border: none;
    border-radius: 14px;
    padding: 14px;
    font-size: 12px;
    font-weight: 800;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    text-shadow: 0 1px 2px rgba(0, 0, 0, 0.3);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    transition: transform 0.2s ease, box-shadow 0.2s ease;
    animation: pulseGlow 2s infinite alternate;
}

@keyframes pulseGlow {
    0% {
        box-shadow: 0 4px 12px rgba(0, 102, 255, 0.4);
    }
    100% {
        box-shadow: 0 0 20px rgba(0, 114, 255, 0.7), 0 0 8px rgba(0, 240, 255, 0.5);
    }
}

.install-btn:active {
    transform: scale(0.97);
}

.slogan-hand {
    font-family: 'Dancing Script', cursive;
    font-size: 16px;
    color: #0072ff;
    margin-top: -2px;
}

.footer-copy {
    font-size: 7.5px;
    font-weight: 600;
    letter-spacing: 0.12em;
    color: #64748b;
    text-transform: uppercase;
    margin-top: -4px;
}
</style>
</head>

<body>

<main class="install-card">

    <div class="brand-header">
        <div class="radio-badge">
            <i class="fas fa-broadcast-tower"></i> 90.3 FM
        </div>
        <h1 class="welcome-title">¡SIENTE EL RITMO QUE TE MUEVE!</h1>
    </div>

    <div class="logo-wrapper">
        <img src="https://i.imgur.com/quYgKa7.png" alt="Logo Alcalá Fiesta">
    </div>

    <p class="info-text">Lleva toda nuestra música y programación en vivo directo a tus oídos.</p>

    <button id="installBtn" class="install-btn">
        <i class="fas fa-download"></i> INSTALAR APP AHORA
    </button>

    <div class="slogan-hand">La Que Te Mueve</div>

    <footer class="footer-copy">&copy; 2026 ALCALÁ STREAMING</footer>

</main>

<script>
if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').catch(err => console.log('SW error:', err));
    });
}

let deferredPrompt;
const installBtn = document.getElementById("installBtn");

window.addEventListener('beforeinstallprompt', (e) => {
    e.preventDefault();
    deferredPrompt = e;
});

installBtn.addEventListener('click', async () => {
    if (deferredPrompt) {
        deferredPrompt.prompt();
        const { outcome } = await deferredPrompt.userChoice;
        if (outcome === 'accepted') {
            deferredPrompt = null;
        }
    } else {
        alert("Para instalar la aplicación, usa el menú de opciones de tu navegador (Añadir a la pantalla de inicio).");
    }
});

window.addEventListener('appinstalled', () => {
    alert("¡Aplicación instalada con éxito!");
});
</script>

</body>
</html>
