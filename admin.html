<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel Publicidad | Alcalá Fiesta</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap" rel="stylesheet">
    <style>
        body { 
            font-family: 'Inter', sans-serif;
            background: #0d121f; 
            min-height: 100vh; 
        }
        .custom-scroll::-webkit-scrollbar { width: 4px; }
        .custom-scroll::-webkit-scrollbar-thumb { background: rgba(168, 85, 247, 0.4); border-radius: 10px; }
        .client-card.hidden-search { display: none !important; }
        .bad-link { border-color: #ef4444 !important; background: rgba(239, 68, 68, 0.1) !important; }
    </style>
</head>
<body class="text-white p-4 flex justify-center">

    <div class="w-full max-w-md bg-[#131a2b] p-5 rounded-[2rem] border border-white/10 shadow-2xl my-auto">
        
        <div class="text-center mb-6">
            <p class="text-slate-400 text-[10px] font-bold tracking-[3px] uppercase">ALCALÁ FIESTA | HUMBERTO POSSO</p>
        </div>

        <!-- FORMULARIO DE REGISTRO -->
        <div class="space-y-3 mb-6 bg-[#1a233a] p-4 rounded-2xl border border-white/5">
            <h3 class="text-[11px] font-black text-purple-300 uppercase tracking-widest text-center">REGISTRAR NUEVO CLIENTE</h3>
            
            <input type="text" id="cliente" placeholder="NOMBRE DEL CLIENTE (EJ: MONTAGAS)" 
                class="w-full p-3.5 rounded-xl bg-[#0d121f] border border-white/10 text-white focus:ring-2 focus:ring-purple-500 outline-none text-xs font-bold uppercase">
            
            <input type="url" id="urlImg" placeholder="LINK DE IMGUR (https://i.imgur.com/...)" 
                class="w-full p-3.5 rounded-xl bg-[#0d121f] border border-white/10 text-white focus:ring-2 focus:ring-purple-500 outline-none text-xs">

            <button onclick="agregarSponsor()" class="w-full bg-[#a855f7] hover:bg-purple-500 p-3.5 rounded-xl font-black text-xs transition-all uppercase tracking-widest shadow-lg shadow-purple-900/30 active:scale-95">
                GUARDAR PUBLICIDAD
            </button>
        </div>

        <!-- BUSCADOR -->
        <div class="relative mb-5">
            <input type="text" id="searchInput" onkeyup="searchClients()" placeholder="BUSCAR CLIENTE POR NOMBRE..." 
                class="w-full p-3.5 pl-10 rounded-xl bg-[#1a233a] border border-white/5 text-white focus:ring-2 focus:ring-purple-500 outline-none text-[10px] font-bold uppercase">
            <i class="fas fa-search absolute left-4 top-1/2 -translate-y-1/2 text-slate-400 text-xs"></i>
        </div>

        <!-- LISTA DE CLIENTES -->
        <div class="space-y-3">
            <div class="flex justify-between items-center px-1">
                <h3 class="text-[10px] font-black text-slate-400 uppercase tracking-[2px]">CLIENTES EN SISTEMA</h3>
                <span id="total-badge" class="bg-purple-900/40 text-purple-300 text-[10px] font-black px-3 py-1 rounded-full border border-purple-500/30">
                    0 TOTAL
                </span>
            </div>

            <div id="clientsList" class="grid gap-2.5 max-h-[320px] overflow-y-auto pr-1 custom-scroll">
                <!-- Se llena dinámicamente con JS -->
            </div>
        </div>

        <!-- BOTÓN GENERAR Y COPIAR PARA GITHUB -->
        <div class="mt-6 pt-4 border-t border-white/10">
            <button onclick="copiarJSON()" class="w-full bg-slate-800 hover:bg-slate-700 text-purple-300 border border-purple-500/30 p-3 rounded-xl font-black text-xs uppercase tracking-wider flex items-center justify-center gap-2">
                <i class="fas fa-code"></i> Copiar Código para publicidad.json
            </button>
        </div>

    </div>

    <script>
        let clientes = [];

        // Cargar clientes existentes al iniciar
        window.addEventListener('load', () => {
            fetch('publicidad.json?t=' + Date.now())
                .then(res => res.json())
                .then(data => {
                    if(Array.isArray(data)) {
                        clientes = data;
                        renderClientes();
                    }
                }).catch(() => renderClientes());
        });

        function renderClientes() {
            const list = document.getElementById('clientsList');
            const badge = document.getElementById('total-badge');
            list.innerHTML = '';
            badge.innerText = clientes.length + ' TOTAL';

            if(clientes.length === 0) {
                list.innerHTML = `<p class="text-center text-xs text-slate-500 py-6">No hay clientes registrados.</p>`;
                return;
            }

            clientes.forEach((item, index) => {
                const card = document.createElement('div');
                card.className = 'client-card bg-[#1a233a] p-2.5 rounded-xl border border-white/5 flex items-center justify-between gap-2';
                card.id = 'card-' + index;

                card.innerHTML = `
                    <div class="w-10 h-10 rounded-lg overflow-hidden flex-shrink-0 bg-black border border-white/10">
                        <img src="${item.url}" class="w-full h-full object-cover" onerror="this.src='https://i.imgur.com/quYgKa7.png'">
                    </div>
                    <div class="flex-1 min-w-0 ml-1">
                        <div class="flex items-center gap-1.5">
                            <p class="client-name font-black text-xs text-slate-100 uppercase truncate">${item.cliente}</p>
                            <span class="w-2 h-2 rounded-full bg-emerald-400 flex-shrink-0"></span>
                        </div>
                        <p class="text-[9px] text-slate-400 font-mono truncate">${item.url}</p>
                    </div>
                    <div class="flex gap-1.5 flex-shrink-0">
                        <button onclick="editarCliente(${index})" class="w-8 h-8 rounded-lg bg-blue-600/20 text-blue-400 hover:bg-blue-600 hover:text-white transition-all text-xs">
                            <i class="fas fa-edit"></i>
                        </button>
                        <button onclick="eliminarCliente(${index})" class="w-8 h-8 rounded-lg bg-red-600/20 text-red-400 hover:bg-red-600 hover:text-white transition-all text-xs">
                            <i class="fas fa-trash"></i>
                        </button>
                    </div>
                `;
                list.appendChild(card);
            });
        }

        function agregarSponsor() {
            const nom = document.getElementById('cliente').value.trim().toUpperCase();
            const url = document.getElementById('urlImg').value.trim();

            if(!nom || !url) {
                alert('Completa el nombre y el link de la imagen.');
                return;
            }

            clientes.unshift({ cliente: nom, url: url });
            document.getElementById('cliente').value = '';
            document.getElementById('urlImg').value = '';
            renderClientes();
            copiarJSON();
        }

        function editarCliente(index) {
            const nuevoNombre = prompt('Nuevo nombre del comercio:', clientes[index].cliente);
            const nuevaUrl = prompt('Nuevo link de la imagen:', clientes[index].url);

            if(nuevoNombre && nuevaUrl) {
                clientes[index].cliente = nuevoNombre.trim().toUpperCase();
                clientes[index].url = nuevaUrl.trim();
                renderClientes();
                copiarJSON();
            }
        }

        function eliminarCliente(index) {
            if(confirm('¿Deseas eliminar este cliente?')) {
                clientes.splice(index, 1);
                renderClientes();
                copiarJSON();
            }
        }

        function searchClients() {
            const filter = document.getElementById('searchInput').value.toUpperCase();
            const cards = document.getElementsByClassName('client-card');
            let found = 0;

            for (let i = 0; i < cards.length; i++) {
                const name = cards[i].querySelector('.client-name').innerText;
                if (name.toUpperCase().includes(filter)) {
                    cards[i].classList.remove('hidden-search');
                    found++;
                } else {
                    cards[i].classList.add('hidden-search');
                }
            }
            document.getElementById('total-badge').innerText = found + ' TOTAL';
        }

        function copiarJSON() {
            const jsonText = JSON.stringify(clientes, null, 2);
            navigator.clipboard.writeText(jsonText).then(() => {
                alert('¡Lista actualizada y copiada al portapapeles!\n\nAhora pégala en tu archivo publicidad.json de GitHub.');
            }).catch(() => {
                prompt('Copia manualmente este código para publicidad.json:', jsonText);
            });
        }
    </script>
</body>
</html>
