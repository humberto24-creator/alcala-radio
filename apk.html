<style>
:root {
    --cyan-neon: #00f0ff;
    --blue-neon: #0072ff;
    --gold: #f2a83b;
}

* {
    box-sizing: border-box;

    -webkit-tap-highlight-color: transparent;
}

html, body {

    background: radial-gradient(circle at 50% 30%, #111a28 0%, #080c14 60%, #030508 100%);

    color: #ffffff;
    display: flex;
    justify-content: center;
    align-items: center;
}

.app-container {
    width: min(92vw, 380px);
    height: min(96dvh, 740px);
    background: linear-gradient(180deg, rgba(14, 21, 32, 0.95) 0%, rgba(8, 12, 19, 0.98) 100%);

    border: 1px solid rgba(0, 240, 255, 0.2);

}

.topbar {

    flex-direction: column;

    position: relative;
}

.live-badge {
    position: absolute;
    right: 0;
    top: -2px;
    display: flex;
    align-items: center;
    gap: 5px;
    border: 1px solid rgba(255, 255, 255, 0.15);
    background: rgba(0, 0, 0, 0.6);
    border-radius: 999px;
    padding: 2px 8px;
    font-size: 8px;
    font-weight: 700;
    transition: all 0.3s ease;
}

.live-dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: #2be878;
    box-shadow: 0 0 6px #2be878;
    transition: background 0.3s ease, box-shadow 0.3s ease;
}

.live-badge.buffering .live-dot {
    background: #f2a83b;
    box-shadow: 0 0 6px #f2a83b;
}

.live-badge.offline .live-dot {
    background: #ff4757;
    box-shadow: 0 0 6px #ff4757;
}

.radio-title {
    font-size: 13px;
    font-weight: 800;
    letter-spacing: 0.18em;
    display: flex;
    align-items: center;
    gap: 6px;
    color: #ffffff;
}

.radio-title i { font-size: 12px; color: var(--cyan-neon); }

.tagline-sub {
    font-size: 8px;
    letter-spacing: 0.18em;
    color: #8fa0b5;
    text-transform: uppercase;
    margin-top: 2px;
}

.logo-card {
    width: min(56vw, 190px);
    aspect-ratio: 1 / 1;
    border-radius: 24px;
    background: linear-gradient(145deg, #182332, #0d131d);
    border: 1px solid rgba(255, 255, 255, 0.12);
    box-shadow: 0 12px 30px rgba(0, 0, 0, 0.8), 0 0 15px rgba(0, 114, 255, 0.15);
    overflow: hidden;
}

.logo-card img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
    transition: opacity 0.3s ease;
}

.now-card {
    width: 100%;
    height: 72px;
    background: linear-gradient(145deg, #131b26, #090d13);
    border: 1px solid rgba(0, 240, 255, 0.2);
    border-radius: 16px;
    padding: 10px 14px;
    display: flex;
    align-items: center;
    gap: 12px;

}

.cover-box {
    position: relative;
    width: 48px;
    height: 48px;
    flex-shrink: 0;
}

.cover-img {
    width: 100%;
    height: 100%;

.note-badge {
    position: absolute;
    bottom: -3px;
    right: -3px;

.meta-info {

.meta-label {

.scroll-wrapper {

}

.meta-song {

.marquee-active {

@keyframes marquee {

}

.play-btn.loading i { animation: spin 1s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

.side-eq {
    justify-self: end;
    display: flex;
    align-items: flex-end;

}

.side-eq span {
    width: 2.5px;

}

.side-eq span:nth-child(1){ height: 6px; }
.side-eq span:nth-child(2){ height: 13px; animation-delay: .2s; }
.side-eq span:nth-child(3){ height: 9px; animation-delay: .4s; }

@keyframes bars { to { transform: scaleY(.3); opacity: .4; } }

.visualizer-wrap {

.visualizer-wrap canvas {

.bottom-bar {

.nav-group {

.btn-install {

.btn-install i {

}

.btn-install:active {

}

@keyframes pulseInstall {
    0% {

}

.slogan-hand {

<script>
// Registro del Service Worker
if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').catch(err => console.log('SW error:', err));
    });
}

// Instalación DIRECTA PWA
let deferredPrompt;
const actionBtn = document.getElementById("actionBtn");

window.addEventListener('beforeinstallprompt', (e) => {
    e.preventDefault();
    deferredPrompt = e;
});

if (actionBtn) {
    actionBtn.addEventListener('click', async (e) => {
        e.preventDefault();
        if (deferredPrompt) {
            deferredPrompt.prompt();
            const { outcome } = await deferredPrompt.userChoice;
            deferredPrompt = null;
        }
    });
}

window.addEventListener('appinstalled', () => {
    deferredPrompt = null;
});

const STREAM_URL = "https://stream.alcalafiesta.com/radio.mp3";
const ICECAST_JSON = "https://stream.alcalafiesta.com/status-json.xsl";
const DEFAULT_LOGO = "https://i.imgur.com/quYgKa7.png";
const PHONE = "573206137061";

const audio = new Audio();
audio.crossOrigin = "anonymous";
audio.preload = "auto";
audio.volume = 1.0;

let userWantsPlay = false;
let isReconnecting = false;
let lastVolume = 1.0;
let currentTrack = "";
let currentArtist = "ALCALÁ FIESTA 90.3 FM";
let currentSongName = "EN VIVO";
let currentCoverUrl = DEFAULT_LOGO;

let audioCtx = null;
let analyser = null;
let source = null;
let gainNode = null;         
let compressorNode = null;   
let vizInit = false;

const playBtn = document.getElementById("play");
const icon = document.getElementById("icon");
const songEl = document.getElementById("song");
const artistEl = document.getElementById("artist");
const songWrap = document.getElementById("songWrap");
const mainLogoEl = document.getElementById("mainLogo");
const smallCoverEl = document.getElementById("smallCover");
const volEl = document.getElementById("vol");
const muteBtn = document.getElementById("muteBtn");
const liveBadge = document.getElementById("liveBadge");
const badgeText = document.getElementById("badgeText");

function setStatusBadge(status, text){
    liveBadge.className = "live-badge";
    if(status === "buffering"){
        liveBadge.classList.add("buffering");
        badgeText.textContent = text || "CONECTANDO";
    }else if(status === "offline"){
        liveBadge.classList.add("offline");
        badgeText.textContent = text || "SIN SEÑAL";
    }else{
        badgeText.textContent = "EN VIVO";
    }
}

function setIcon(state){
    playBtn.classList.remove("loading");
    if(state === "loading"){
        playBtn.classList.add("loading");
        icon.className = "fas fa-circle-notch";
        setStatusBadge("buffering", "CONECTANDO");
    }else if(state === "pause"){
        icon.className = "fas fa-pause";
        setStatusBadge("live");
    }else{
        icon.className = "fas fa-play";
        setStatusBadge("offline", "PAUSADO");
    }
}

function updateMediaSession(){
    if('mediaSession' in navigator){
        try {
            navigator.mediaSession.metadata = new MediaMetadata({
                title: currentSongName,
                artist: currentArtist,
                album: 'Alcalá Fiesta 90.3 FM',
                artwork: [
                    { src: currentCoverUrl, sizes: '512x512', type: 'image/png' }
                ]
            });
            navigator.mediaSession.setActionHandler('play', () => { if(!userWantsPlay) togglePlay(); });
            navigator.mediaSession.setActionHandler('pause', () => { if(userWantsPlay) togglePlay(); });
        } catch(e){}
    }
}

function initViz(){
    if(vizInit) return;
    try{
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        analyser = audioCtx.createAnalyser();
        analyser.fftSize = 128;
        analyser.smoothingTimeConstant = 0.75;
        
        gainNode = audioCtx.createGain();
        const initialVol = Number(volEl.value);
        gainNode.gain.value = initialVol === 1 ? 1.8 : (0.2 + (initialVol * 1.6));

        compressorNode = audioCtx.createDynamicsCompressor();
        compressorNode.threshold.value = -10; 
        compressorNode.knee.value = 20;       
        compressorNode.ratio.value = 3;       
        compressorNode.attack.value = 0.003;  
        compressorNode.release.value = 0.25;  

        source = audioCtx.createMediaElementSource(audio);
        
        source.connect(analyser);
        analyser.connect(gainNode);
        gainNode.connect(compressorNode);
        compressorNode.connect(audioCtx.destination);

        vizInit = true;
        renderViz();
    }catch(e){}
}

function renderViz(){
    const canvas = document.getElementById("visualizer");
    if(!canvas) return;
    const ctx = canvas.getContext("2d");

    const resize = () => {
        if(canvas.parentElement){
            canvas.width = canvas.parentElement.clientWidth;
            canvas.height = canvas.parentElement.clientHeight;
        }
    };
    resize();
    window.addEventListener("resize", resize);

    const len = analyser ? analyser.frequencyBinCount : 64;
    const data = new Uint8Array(len);

    function draw(){
        requestAnimationFrame(draw);
        if(!userWantsPlay || audio.paused || !analyser){
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            return;
        }
        analyser.getByteFrequencyData(data);

        const w = canvas.width;
        const h = canvas.height;
        ctx.clearRect(0, 0, w, h);

        const bars = 42; 
        const gap = 2.5;
        const barW = (w - (gap * (bars - 1))) / bars;

        for(let i = 0; i < bars; i++){
            const index = Math.floor((i / bars) * (len * 0.85));
            const val = data[index] / 255;
            const bh = Math.max(4, val * h * 0.95);
            const x = i * (barW + gap);
            const y = h - bh;

            const grad = ctx.createLinearGradient(0, y, 0, h);
            grad.addColorStop(0, "#00f0ff");
            grad.addColorStop(0.5, "#0072ff");
            grad.addColorStop(1, "rgba(0, 114, 255, 0.15)");

            ctx.fillStyle = grad;
            ctx.shadowBlur = 6;
            ctx.shadowColor = "rgba(0, 240, 255, 0.4)";
            ctx.fillRect(x, y, barW, bh);
        }
        ctx.shadowBlur = 0;
    }
    draw();
}

async function startStream(){
    if(isReconnecting) return;
    isReconnecting = true;
    setIcon("loading");

    if(!vizInit) initViz();
    if(audioCtx && audioCtx.state === "suspended"){
        try{ await audioCtx.resume(); }catch(e){}
    }

    audio.src = STREAM_URL + (STREAM_URL.includes("?") ? "&" : "?") + "live=" + Date.now();
    
    try{
        await audio.play();
        setIcon("pause");
        updateMediaSession();
    }catch(e){
        if(userWantsPlay){
            setStatusBadge("buffering", "RECONECTANDO");
            setTimeout(() => { isReconnecting = false; startStream(); }, 2000);
            return;
        }else{
            setIcon("play");
        }
    }
    isReconnecting = false;
}

function stopStream(){
    userWantsPlay = false;
    isReconnecting = false;
    audio.pause();
    audio.removeAttribute("src");
    audio.load();
    setIcon("play");
}

function togglePlay(){
    if(userWantsPlay){
        stopStream();
    }else{
        userWantsPlay = true;
        startStream();
    }
}

playBtn.addEventListener("click", togglePlay);

function updateVolumeUI(val){
    volEl.value = val;
    audio.volume = val;
    if(gainNode){
        gainNode.gain.value = val === 0 ? 0 : (val === 1 ? 1.8 : (0.2 + (val * 1.6)));
    }
    if(val == 0){
        muteBtn.className = "fas fa-volume-xmark";
        muteBtn.style.color = "#ff4757";
    } else {
        muteBtn.className = "fas fa-volume-high";
        muteBtn.style.color = "#8fa0b5";
    }
}

volEl.addEventListener("input", e => {
    const val = Number(e.target.value);
    if(val > 0) lastVolume = val;
    updateVolumeUI(val);
});

muteBtn.addEventListener("click", () => {
    if(Number(volEl.value) > 0){
        lastVolume = Number(volEl.value);
        updateVolumeUI(0);
    } else {
        updateVolumeUI(lastVolume > 0 ? lastVolume : 0.8);
    }
});

audio.addEventListener("waiting", () => {
    if(userWantsPlay) setIcon("loading");
});

audio.addEventListener("playing", () => {
    if(userWantsPlay) setIcon("pause");
});

audio.addEventListener("error", () => {
    if(userWantsPlay && !isReconnecting){
        setStatusBadge("buffering", "RECONECTANDO");
        setTimeout(() => { isReconnecting = false; startStream(); }, 2500);
    }
});

window.addEventListener("online", () => {
    if(userWantsPlay && audio.paused) startStream();
});

document.addEventListener("visibilitychange", () => {
    if(!document.hidden && userWantsPlay && audio.paused){
        startStream();
    }
});

function setMainCover(url){
    const validUrl = (url && url.startsWith("http")) ? url : DEFAULT_LOGO;
    currentCoverUrl = validUrl;
    
    mainLogoEl.onerror = null;
    smallCoverEl.onerror = null;

    mainLogoEl.src = validUrl;
    smallCoverEl.src = validUrl;
    
    mainLogoEl.onerror = () => {
        mainLogoEl.onerror = null;
        currentCoverUrl = DEFAULT_LOGO;
        mainLogoEl.src = DEFAULT_LOGO;
    };
    smallCoverEl.onerror = () => {
        smallCoverEl.onerror = null;
        smallCoverEl.src = DEFAULT_LOGO;
    };
    updateMediaSession();
}

function updateWA(track){
    const msg = encodeURIComponent(`Hola Alcalá Fiesta, estoy escuchando: "${track}"`);
    const isMobile = /Android|iPhone|iPad/i.test(navigator.userAgent);
    document.getElementById("waLink").href = isMobile
        ? `https://api.whatsapp.com/send?phone=${PHONE}&text=${msg}`
        : `https://web.whatsapp.com/send?phone=${PHONE}&text=${msg}`;
}

function applyScroll(element, wrapper){
    element.classList.remove("marquee-active");
    const txt = element.dataset.text || element.textContent || "";
    element.textContent = txt;

    setTimeout(() => {
        if(element.scrollWidth > wrapper.clientWidth){
            element.innerHTML = `${txt} &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp; ${txt}`;
            element.classList.add("marquee-active");
        }
    }, 50);
}

function normalizeText(text) {
    if (!text) return "";
    return text.toLowerCase()
        .normalize("NFD").replace(/[\u0300-\u036f]/g, "")
        .replace(/[^a-z0-9\s]/g, " ")
        .replace(/\s+/g, " ")
        .trim();
}

async function checkSponsorAndCover(rawTrack, artist, song){
    try {
        const res = await fetch('publicidad.json?t=' + Date.now(), { cache: 'no-store' });
        if(res.ok){
            const sponsors = await res.json();
            if(Array.isArray(sponsors) && sponsors.length > 0){
                const upperTrack = rawTrack.toUpperCase();
                for(let sponsor of sponsors){
                    const clientName = sponsor.cliente ? sponsor.cliente.trim().toUpperCase() : "";
                    if(clientName && upperTrack.includes(clientName)){
                        setMainCover(sponsor.url);
                        return; 
                    }
                }
            }
        }
    } catch(e) {}

    fetchAlbumCover(artist, song);
}

async function fetchAlbumCover(artist, song){
    if(!artist && !song){
        setMainCover(DEFAULT_LOGO);
        return;
    }

    const cleanArtist = artist.replace(/[()\[\]]/g, "").replace(/feat\.|ft\.|y\s+/gi, "").trim();
    const cleanSong = song.replace(/^[0-9]+\s*[-–]\s*/, "").replace(/\(.*?\)|\[.*?\]|remix|mix|en vivo|live|radio edit|version/gi, "").trim();
    const query = `${cleanArtist} ${cleanSong}`.trim();

    try {
        const res = await fetch(`https://itunes.apple.com/search?term=${encodeURIComponent(query)}&media=music&entity=song&limit=4`);
        const data = await res.json();
        
        if(data.results && data.results.length > 0){
            const normTarget = normalizeText(cleanArtist);
            for(let item of data.results) {
                const itemArtistNorm = normalizeText(item.artistName);
                if(normTarget && (itemArtistNorm.includes(normTarget) || normTarget.includes(itemArtistNorm))) {
                    const art = item.artworkUrl100.replace("100x100bb", "600x600bb");
                    setMainCover(art);
                    return;
                }
            }
            const art = data.results[0].artworkUrl100.replace("100x100bb", "600x600bb");
            setMainCover(art);
            return;
        }
    } catch(e) {}

    try {
        const resArtist = await fetch(`https://itunes.apple.com/search?term=${encodeURIComponent(cleanArtist)}&media=music&entity=musicArtist&limit=1`);
        const dataArtist = await resArtist.json();
        if(dataArtist.results && dataArtist.results.length > 0 && dataArtist.results[0].artworkUrl100) {
            const art = dataArtist.results[0].artworkUrl100.replace("100x100bb", "600x600bb");
            setMainCover(art);
            return;
        }
    } catch(e) {}

    setMainCover(DEFAULT_LOGO);
}

async function updateMeta(){
    try{
        const res = await fetch(ICECAST_JSON + "?t=" + Date.now(), { cache: "no-store" });
        if(!res.ok) return;
        const data = await res.json();
        const src = data?.icestats?.source;
        if(!src) return;

        const s = Array.isArray(src) ? (src.find(i => i.mount === "/radio.mp3" || i.mount === "radio.mp3") || src[0]) : src;
        if(!s || !s.title) return;

        const raw = String(s.title).trim();
        if(!raw || raw === currentTrack) return;
        currentTrack = raw;

        let a = "", song = raw;
        if(raw.includes(" - ")){
            const p = raw.split(" - ");
            a = p.shift().trim();
            song = p.join(" - ").trim();
        }

        currentSongName = song || "EN VIVO";
        currentArtist = a || "ALCALÁ FIESTA 90.3 FM";

        songEl.dataset.text = currentSongName;
        artistEl.textContent = currentArtist;

        applyScroll(songEl, songWrap);
        updateWA(currentTrack);
        
        checkSponsorAndCover(raw, a, song);
        
        updateMediaSession();
    }catch(e){
        if(currentSongName === "CARGANDO..."){
            songEl.dataset.text = "ALCALÁ FIESTA 90.3 FM";
            artistEl.textContent = "SEÑAL EN DIRECTO";
            applyScroll(songEl, songWrap);
        }
    }
}

window.addEventListener("load", () => {
    updateMeta();
    setInterval(updateMeta, 9000);
});
</script>
